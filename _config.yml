# Core site settings
locale: "en-US"
site_theme: "default"
title: "Recko Zhu"
title_separator: "·"
name: &name "Recko Zhu"
description: &description "PhD Candidate at Xiamen University working on multimodal intelligence, 3D vision, and localization."
url: "https://reckozmh.github.io"
baseurl: "/ReckoZhu.github.io"
repository: "Reckozmh/ReckoZhu.github.io"

# TODO: Confirm the preferred full English/Chinese display name.
author:
  avatar: "profile.jpg"
  name: "Recko Zhu"
  bio: "PhD Candidate"
  location: "Xiamen, China"
  employer: "Xiamen University"
  email: "judemihoo@gmail.com"
  cv: "/cv/"
  googlescholar: "https://scholar.google.com/citations?user=YILgmXQAAAAJ&hl=zh-CN&oi=ao"
  github: "Reckozmh"

publication_category:
  conferences:
    title: "Conference Papers"
  manuscripts:
    title: "Journal Articles"

# Site behavior
breadcrumbs: false
words_per_minute: 180
future: true
read_more: "disabled"
talkmap_link: false
comments:
  provider: false
atom_feed:
  hide: true

# SEO and social metadata
social:
  type: Person
  name: "Recko Zhu"
  links:
    - "https://github.com/Reckozmh"
    - "https://scholar.google.com/citations?user=YILgmXQAAAAJ&hl=zh-CN&oi=ao"
og_image: "/images/profile.jpg"
og_description: *description
analytics:
  provider: false

# Files and content
include:
  - _pages
  - files
exclude:
  - .asset-cache
  - .bundle
  - .devcontainer
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - node_modules
  - package.json
  - README.md
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Markdown and rendering
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

collections:
  publications:
    output: true
    permalink: /publications/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Asia/Shanghai

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

compress_html:
  clippings: all
  ignore:
    envs: development
